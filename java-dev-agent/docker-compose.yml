# 開發用：Langfuse（可觀測性 + Prompt Management）與 Agent 自己的 PostgreSQL。
# 啟動：docker compose up -d ；Langfuse UI：http://localhost:3000（第一次需註冊帳號並建立 project 取得 API keys）
services:
  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["5433:5432"]
    volumes: ["agent_db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent"], interval: 5s, timeout: 3s, retries: 10 }

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    depends_on: { langfuse-db: { condition: service_healthy }, clickhouse: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }
    ports: ["3000:3000"]
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      SALT: change-me-salt-0123456789abcdef
      ENCRYPTION_KEY: fccfa1144f7be9e77a1e9814b98081419f736653a6839e8f7a645a12669e45b1  # 開發用；正式環境請以 openssl rand -hex 32 另行產生
      NEXTAUTH_SECRET: change-me-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: redispass
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # 開發便利：自動建立組織 / 專案 / API keys（與 .env.example 一致）
      LANGFUSE_INIT_ORG_ID: local-org
      LANGFUSE_INIT_PROJECT_ID: local-project
      LANGFUSE_INIT_PROJECT_NAME: java-coding-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-dev
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: devpassword1

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    depends_on: { langfuse-db: { condition: service_healthy }, clickhouse: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }
    environment: *langfuse-env

  langfuse-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }
    volumes: ["langfuse_db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U langfuse"], interval: 5s, timeout: 3s, retries: 10 }

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: clickhouse }
    volumes: ["clickhouse_data:/var/lib/clickhouse", "clickhouse_logs:/var/log/clickhouse-server"]
    healthcheck: { test: ["CMD-SHELL", "clickhouse-client --user clickhouse --password clickhouse --query 'SELECT 1'"], interval: 5s, timeout: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redispass", "--maxmemory-policy", "noeviction"]

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret }
    ports: ["9090:9000"]
    volumes: ["minio_data:/data"]

volumes:
  agent_db: {}
  langfuse_db: {}
  clickhouse_data: {}
  clickhouse_logs: {}
  minio_data: {}
